<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>revo ide</title>
	<link rel="stylesheet" href="/bark.css">
	<script type="importmap">
{
  "imports": {
    "codemirror": "/vendor/codemirror.js",
    "@codemirror/view": "/vendor/@codemirror/view.js",
    "@codemirror/state": "/vendor/@codemirror/state.js",
    "@codemirror/language": "/vendor/@codemirror/language.js",
    "@codemirror/commands": "/vendor/@codemirror/commands.js",
    "@codemirror/search": "/vendor/@codemirror/search.js",
    "@codemirror/autocomplete": "/vendor/@codemirror/autocomplete.js",
    "@codemirror/lint": "/vendor/@codemirror/lint.js",
    "@codemirror/theme-one-dark": "/vendor/@codemirror/theme-one-dark.js",
    "@codemirror/lang-json": "/vendor/@codemirror/lang-json.js",
    "@replit/codemirror-vim": "/vendor/@replit/codemirror-vim.js",
    "@replit/codemirror-vim-core": "/vendor/@replit/codemirror-vim-core.js",
    "@lezer/common": "/vendor/@lezer/common.js",
    "@lezer/highlight": "/vendor/@lezer/highlight.js",
    "@lezer/json": "/vendor/@lezer/json.js",
    "@lezer/lr": "/vendor/@lezer/lr.js",
    "style-mod": "/vendor/style-mod.js",
    "w3c-keyname": "/vendor/w3c-keyname.js",
    "@marijn/find-cluster-break": "/vendor/@marijn/find-cluster-break.js",
    "crelt": "/vendor/crelt.js"
  }
}
</script>
		<link rel="stylesheet" href="style.css"/>
</head>

<body>
	<div class="toolbar">
		<button class="run-btn" id="run-btn">run</button>
		<button id="reset-btn">reset</button>
		<select id="example-select">
			<option value="" selected disabled hidden>examples</option>
		</select>
		<div class="spacer"></div>
		<button id="vim-btn">vim</button>
		<button id="clear-btn">clear</button>
	</div>
	<div class="main">
		<div class="editor-pane" id="editor"></div>
		<div class="output-pane">
			<div class="result-box pane-box" data-label="result" id="result-box"></div>
			<div class="io-box pane-box" data-label="stdout / stderr" id="io-box"></div>
		</div>
	</div>

	<script src="editor.js" type="module"></script>
</body>

</html>
