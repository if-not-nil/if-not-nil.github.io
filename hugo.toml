title = "if err != nil"
baseURL = 'https://if-not-nil.github.io'
locale = 'en-us'
enableRobotsTXT = "true"

[server]
[[server.headers]]
  for = "/img/**"
  [server.headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[server.headers]]
  for = "/css/**"
  [server.headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[server.headers]]
  for = "/fonts/**"
  [server.headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[markup.goldmark.renderer]
	hardWraps = true
	unsafe = true

[security]
  allowContent = ['.+']

[params]
# "relatedtext" is the text that appears above the tag list at the bottom of pages.
    relatedtext = "related"
    favicon = "/img/favicon.gif"
    default_image = "/img/cat.png"
#list items
    datesinlist = true

#footer items
    nextprev = true
    taglist = true
    showrss = true
