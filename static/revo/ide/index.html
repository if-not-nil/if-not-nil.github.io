<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>revo ide</title>
	<link rel="stylesheet" href="/bark.css">
	<script type="importmap">
{
  "imports": {
    "codemirror": "https://cdn.jsdelivr.net/npm/codemirror@6/dist/index.js",
    "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6/dist/index.js",
    "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6/dist/index.js",
    "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6/dist/index.js",
    "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6/dist/index.js",
    "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6/dist/index.js",
    "@codemirror/autocomplete": "https://cdn.jsdelivr.net/npm/@codemirror/autocomplete@6/dist/index.js",
    "@codemirror/lint": "https://cdn.jsdelivr.net/npm/@codemirror/lint@6/dist/index.js",
    "@codemirror/theme-one-dark": "https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6/dist/index.js",
    "@replit/codemirror-vim": "https://cdn.jsdelivr.net/npm/@replit/codemirror-vim@6/dist/index.js",
    "@lezer/common": "https://cdn.jsdelivr.net/npm/@lezer/common@1/dist/index.js",
    "@lezer/highlight": "https://cdn.jsdelivr.net/npm/@lezer/highlight@1/dist/index.js",
    "style-mod": "https://cdn.jsdelivr.net/npm/style-mod@4/src/style-mod.js",
    "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2/index.js",
    "@marijn/find-cluster-break": "https://cdn.jsdelivr.net/npm/@marijn/find-cluster-break@1/src/index.js",
    "crelt": "https://cdn.jsdelivr.net/npm/crelt@1/index.js"
  }
}
</script>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			height: 100%;
			overflow: hidden;
		}

		body {
			font-family: 'Maple Mono NL NF', 'JetBrains Mono', ui-monospace, Consolas, monospace;
			font-size: 13px;
			background: var(--base00);
			color: var(--base05);
			display: flex;
			flex-direction: column;
		}

		/* --- toolbar */

		.toolbar {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 6px 10px;
			background: var(--base01);
			border-bottom: 1px solid var(--base02);
			flex-shrink: 0;
		}

		.toolbar button {
			font: inherit;
			font-size: 12px;
			padding: 5px 12px;
			border: 1px solid var(--base02);
			border-radius: 3px;
			background: transparent;
			color: var(--base05);
		}

		.toolbar button:hover {
			border-color: var(--base03);
			background: var(--base02);
		}

		.toolbar .spacer {
			flex: 1;
		}

		.toolbar select {
			font: inherit;
			font-size: 12px;
			padding: 5px 8px;
			border: 1px solid var(--base02);
			border-radius: 3px;
			background: var(--base01);
			color: var(--base05);
		}

		.toolbar select:hover {
			border-color: var(--base03);
		}

		.toolbar input {
			font: inherit;
			font-size: 12px;
			padding: 5px 8px;
			border: 1px solid var(--base02);
			border-radius: 3px;
			background: var(--base01);
			color: var(--base05);
			width: 280px;
		}

		.toolbar button.run-btn {
			background: var(--base0B);
			border-color: var(--base0B);
			color: var(--base00);
			font-weight: 600;
		}

		.toolbar button.run-btn:hover {
			filter: brightness(1.1);
		}


		.toolbar button.active-toggle {
			border-color: var(--base0D);
			color: var(--base0D);
		}

		/* --- layout */

		.main {
			display: flex;
			flex: 1;
			min-height: 0;
		}

		.editor-pane {
			flex: 3;
			min-width: 0;
			border-right: 1px solid var(--base02);
		}

		.editor-pane .cm-editor {
			height: 100%;
		}

		.editor-pane .cm-scroller {
			overflow: auto;
		}

		.output-pane {
			flex: 2;
			min-width: 300px;
			display: flex;
			flex-direction: column;
			background: var(--base01);
		}

		/* --- shared pane box: result + io only differ in size/color/empty text */

		.pane-box {
			padding: 8px 12px;
			line-height: 1.5;
			white-space: pre-wrap;
			word-break: break-word;
			overflow: auto;
		}

		.pane-box::before {
			content: attr(data-label);
			display: block;
			font-size: 10px;
			color: var(--base03);
			margin-bottom: 4px;
		}

		.result-box {
			flex-shrink: 0;
			max-height: 30%;
			border-bottom: 1px solid var(--base02);
		}

		.result-box:empty::after {
			content: '—';
			color: var(--base03);
		}

		.result-box.ok {
			color: var(--base0B);
		}

		.result-box.err {
			color: var(--base08);
		}

		.io-box {
			flex: 1;
			color: var(--base04);
		}

		.io-box:empty::after {
			content: 'nothing printed yet';
			color: var(--base03);
			font-style: italic;
		}

		@media (max-width: 720px) {
			.main {
				flex-direction: column;
			}

			.editor-pane {
				flex: none;
				height: 50vh;
				border-right: none;
				border-bottom: 1px solid var(--base02);
			}
		}
	</style>
</head>

<body>
	<div class="toolbar">
		<button class="run-btn" id="run-btn">run</button>
		<button id="reset-btn">reset</button>
		<select id="example-select">
			<option value="" selected disabled hidden>examples</option>
		</select>
		<div class="spacer"></div>
		<button id="vim-btn">vim</button>
		<button id="clear-btn">clear</button>
	</div>
	<div class="main">
		<div class="editor-pane" id="editor"></div>
		<div class="output-pane">
			<div class="result-box pane-box" data-label="result" id="result-box"></div>
			<div class="io-box pane-box" data-label="stdout / stderr" id="io-box"></div>
		</div>
	</div>

	<script src="editor.js" type="module"></script>
</body>

</html>
