<link rel="preload" href="/fonts/noto-sans-mono-v32-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="canonical" href="{{ .Site.BaseURL }}">
{{- range .AlternativeOutputFormats }}
{{- $href := .Permalink }}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ $href | safeURL }}" title="{{ .Name }}">
{{- end }}
{{ with .Site.Params.favicon }}
<link rel="icon" href="{{ . }}">
{{ end -}}
<meta name="description"
	content="{{ with .Params.description }}{{ . | lower }}{{ else }}{{ .Summary | lower }}{{ end }}">
{{ if isset .Params "tags" }}
<meta name="keywords" content="{{ with .Params.tags }}{{ delimit . " , " }}{{ end }}">
{{ end -}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<script data-goatcounter="https://if-not-nil.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101010">

<!-- images for social media preview -->
<meta property="og:title" content="{{ .Title | lower }}">
<meta property="og:description" content="{{ .Params.description | lower }}">

{{ $img := or (index .Params.images 0) .Site.Params.default_image }}
{{ if $img }}
<meta property="og:image" content="{{ $img | absURL }}">
<meta name="twitter:image" content="{{ $img | absURL }}">
{{ end }}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title | lower }}">
<meta name="twitter:description" content="{{ .Params.description | lower }}">

{{ with index .Params.images 0 }}
<meta name="twitter:image" content="{{ . | absURL }}">
{{ end }}
